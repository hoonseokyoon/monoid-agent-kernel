name: CI

on:
  push:
    branches: [main, develop, codex/v0.23-production-adapters, codex/v0.25-p3-host-resources, codex/v0.25-p1-p2-call-facts, codex/v0.25-p4-termination-budget, codex/v0.25-dx2-integration-recipes]

permissions:
  contents: read

jobs:
  studio-ui:
    name: Studio UI build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: studio-ui/package-lock.json
      - name: Install Studio UI dependencies
        working-directory: studio-ui
        run: npm ci
      - name: Type and accessibility check
        working-directory: studio-ui
        run: npm run check
      - name: Build packaged Studio UI
        working-directory: studio-ui
        run: npm run build
      - name: Verify committed assets are current
        run: git diff --exit-code -- src/monoid_agent_kernel/reference/studio/web/dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install lint tooling
        # Pinned deliberately. Unpinned, this job lints every branch with whatever ruff released
        # most recently: 0.16.0 expanded the default rule set and turned every green branch red
        # overnight (532 findings repo-wide, none of them regressions). Bump this pin in a commit
        # that also fixes the new findings, so the migration is reviewable on its own.
        run: python -m pip install ruff==0.15.6
      - name: Lint
        run: ruff check src tests tools/v023_ci.py

  fast-contract:
    name: Fast + contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,openai]"
      - name: Run deterministic parallel shard
        run: python -m pytest -q -n 4 -m "(unit or contract) and not serial" --durations=25

  integration:
    name: Serial integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,openai]"
      - name: Run bounded serial shard
        run: >
          python -m pytest -q
          -m "(integration or serial) and not live and not service"
          --durations=25

  coverage:
    name: Coverage floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,openai]"
      - name: Measure parallel unit and contract coverage
        run: >
          python -m pytest -q -n 4 -m "(unit or contract) and not serial"
          --cov=monoid_agent_kernel
          --cov=native_agent_runner
          --cov-report=
      - name: Append serial integration coverage and enforce floor
        run: >
          python -m pytest -q -m "(integration or serial) and not live and not service"
          --cov=monoid_agent_kernel
          --cov=native_agent_runner
          --cov-append
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=80
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  platform-smoke:
    name: ${{ matrix.os }} smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run platform-sensitive smoke
        run: >
          python -m pytest -q
          tests/test_path_patterns.py
          tests/test_workspace_paths_properties.py
          tests/test_workspace_permissions.py
          tests/test_workspace_contract.py
          tests/test_file_lock.py
          tests/test_spec_serialization.py

  dbos-reference:
    name: Experimental DBOS activation recovery (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install experimental DBOS profile
        run: python -m pip install -e ".[dev,reference-dbos]"
      - name: Run DBOS process-restart and idempotency acceptance tests
        run: >-
          python -m pytest -q
          tests/test_backend_dbos_run.py
          tests/test_backend_dbos_control.py
          tests/test_dbos_control_models.py
          tests/test_dbos_hosted_control.py
          tests/test_dbos_hosted_run.py
          tests/test_dbos_owned_runtime.py
          tests/test_dbos_runtime_host.py
          tests/test_dbos_run_driver.py
          tests/test_dbos_run_models.py
          --durations=10

  install-smoke:
    name: Install smoke (${{ matrix.install }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - install: minimal
            extras: ""
          - install: all-extras
            extras: "[openai,http-async,otel-export,mcp,reference-dbos,durable-host]"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and audit exact release wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python tools/release_wheel_audit.py dist
      - name: Install exact release wheel
        run: |
          wheel_path="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel_path"
          python -m pip install "${wheel_path}${{ matrix.extras }}"
      - name: Import public and optional surfaces
        run: >
          python -c "import monoid_agent_kernel;
          import monoid_agent_kernel.hosting;
          import monoid_agent_kernel.conformance;
          import monoid_agent_kernel.providers.openai;
          import monoid_agent_kernel.providers.gateway;
          import monoid_agent_kernel.observability.otel;
          import monoid_agent_kernel.mcp;
          import monoid_agent_kernel.reference.dbos;
          import monoid_agent_kernel.adapters.postgres;
          import monoid_agent_kernel.adapters.object_store;
          import monoid_agent_kernel.adapters.temporal"
      - name: Verify optional dependencies
        if: matrix.install == 'all-extras'
        run: python -c "import boto3, dbos, openai, httpx, opentelemetry.sdk, psycopg, psycopg_pool, temporalio"
      - name: Verify installed example and gateway import provenance
        if: matrix.install == 'minimal'
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys
          from pathlib import Path

          examples = Path(os.environ["GITHUB_WORKSPACE"]) / "examples"
          env = os.environ.copy()
          env.pop("PYTHONPATH", None)
          probe = r'''
          import runpy
          import subprocess
          import sys
          import sysconfig
          from importlib.metadata import distribution
          from pathlib import Path
          from types import SimpleNamespace
          from unittest.mock import patch

          expected = Path(distribution("monoid-agent-kernel").locate_file(
              "monoid_agent_kernel/__init__.py")).resolve()
          assert expected.is_relative_to(Path(sysconfig.get_paths()["purelib"]).resolve())
          namespace = runpy.run_path(sys.argv[1], run_name="example_import_probe")
          if sys.argv[2] == "parent":
              import monoid_agent_kernel
              assert Path(monoid_agent_kernel.__file__).resolve() == expected
          else:
              helper = namespace["_start_real_gateway_subprocess"]
              launches = []
              def capture(command, **kwargs):
                  launches.append((command, kwargs))
                  return SimpleNamespace(poll=lambda: 0)
              with patch.dict(helper.__globals__, {
                  "_free_port": lambda: 40123, "_wait_for_health": lambda *args: None,
              }), patch("subprocess.Popen", capture):
                  _, stop, _ = helper(token_secret="example-token", admin_token="example-admin",
                                      openai_api_key="example-key")
                  stop()
              (command, options), = launches
              assert command[:5] == [sys.executable, "-m", "monoid_agent_kernel.cli",
                                     "llm-gateway", "serve"]
              subprocess.run([
                  command[0], "-c", "import sys; from pathlib import Path; "
                  "import monoid_agent_kernel as package; "
                  "assert Path(package.__file__).resolve() == Path(sys.argv[1])", str(expected),
              ], cwd=options["cwd"], env=options["env"], check=True, timeout=30)
          print(f"{sys.argv[2]} {Path(sys.argv[1]).name}: {expected}")
          '''
          parents = (
              "custom_model_adapter.py", "custom_tool_quickstart.py", "embedding_hosted_product.py",
              "embedding_local_product.py", "full_stack_integration.py", "memory_quickstart.py",
              "messy_workspace_cleanup.py", "minimal_quickstart.py", "otel_tracing.py",
          )
          failures = []
          for mode, names in (("parent", parents), ("child", (
              "full_stack_integration.py", "messy_workspace_cleanup.py",
          ))):
              for name in names:
                  result = subprocess.run([sys.executable, "-c", probe, str(examples / name), mode],
                                          env=env, text=True, capture_output=True, timeout=60)
                  print(result.stdout, end="")
                  if result.returncode:
                      failures.append(f"{mode}:{name}")
                      print(result.stderr, end="")
          assert not failures, failures
          PY
      - name: Run copied integration examples from installed package
        if: matrix.install == 'minimal'
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          from pathlib import Path

          examples = Path(os.environ["GITHUB_WORKSPACE"]) / "examples"
          env = os.environ.copy()
          env.pop("PYTHONPATH", None)
          with tempfile.TemporaryDirectory(prefix="monoid-installed-examples-") as directory:
              for name in ("custom_tool_quickstart.py", "model_call_facts.py",
                           "recover_model_call_facts.py", "termination_budget.py"):
                  copied = Path(directory) / name
                  shutil.copyfile(examples / name, copied)
                  subprocess.run([sys.executable, str(copied)], cwd=directory, env=env,
                                 check=True, timeout=60)
          PY
      - name: Run installed host resource approval and recovery recipe
        if: matrix.install == 'minimal'
        working-directory: ${{ runner.temp }}
        run: python -m monoid_agent_kernel.reference.host_tool_report
      - name: Run installed conformance evidence smoke
        if: matrix.install == 'minimal'
        working-directory: ${{ runner.temp }}
        run: |
          python -m monoid_agent_kernel.conformance.runner \
            --harness monoid_agent_kernel.reference.conformance:create_minimal_harness \
            --json-out conformance.json \
            --junit-out conformance.xml \
            --evidence-dir conformance-evidence
          python -c "from pathlib import Path; from monoid_agent_kernel.conformance import read_conformance_report, verify_conformance_report; loaded = read_conformance_report(Path('conformance.json')); assert loaded.status == 'loaded' and loaded.value is not None; report = loaded.value; reference = report.evidence[0]; result = verify_conformance_report(report, {reference.evidence_id: (Path('conformance-evidence') / reference.resource.name).read_bytes()}); assert result.verified and result.report_passed"
      - name: Run minimal Studio acceptance from installed package
        if: matrix.install == 'minimal'
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import importlib.util; assert importlib.util.find_spec('httpx') is None"
          monoid studio accept \
            --workspace "${{ runner.temp }}/studio-workspace" \
            --run-root "${{ runner.temp }}/studio-runs"

  combined-services:
    name: V0.23 combined actual services
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONOID_SERVICE_PROFILE: combined
      MONOID_POSTGRES16_DSN: postgresql://monoid:monoid-local-only@127.0.0.1:55416/monoid_kernel_test
      MONOID_POSTGRES18_DSN: postgresql://monoid:monoid-local-only@127.0.0.1:55418/monoid_kernel_test
      MONOID_MINIO_ENDPOINT: http://127.0.0.1:59000
      MONOID_MINIO_ACCESS_KEY: monoid-test-access
      MONOID_MINIO_SECRET_KEY: monoid-test-secret-only
      MONOID_TEMPORAL_CLI_VERSION: v1.8.2
      COMPOSE_PROFILES: combined
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install exact campaign SDKs
        run: |
          python -m pip install -e ".[dev,durable-host]"
          python tools/v023_ci.py exact-requirements | xargs python -m pip install
          python tools/v023_ci.py verify-installed
      - name: Start PostgreSQL and MinIO
        run: docker compose -f tests/service/compose.yml up -d --wait
      - name: Run combined service integration
        run: python -m pytest -q tests/service -m service --durations=10
      - name: Record integration evidence
        run: >
          python tools/v023_ci.py write-evidence
          --head-sha "$GITHUB_SHA"
          --merge-sha "$GITHUB_SHA"
          --profile combined
          --output .tmp/v023-ci-evidence.json
      - uses: actions/upload-artifact@v7
        with:
          name: v023-combined-evidence
          path: .tmp/v023-ci-evidence.json
      - name: Stop PostgreSQL and MinIO
        if: always()
        run: docker compose -f tests/service/compose.yml down --volumes
