name: V0.23 PR fast

on:
  pull_request:
    types: [opened, reopened, synchronize, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: fast-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Python 3.12 fast contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fast gate dependencies
        run: python -m pip install -e ".[dev]" ruff==0.15.6
      - name: Validate campaign lock
        run: python tools/v023_ci.py validate-lock
      - name: Lint Python sources
        run: ruff check src tests tools/v023_ci.py
      - name: Run deterministic unit and contract gate
        run: >
          python -m pytest -q -n 4
          -m "(unit or contract) and not serial and not service"
          --durations=25
